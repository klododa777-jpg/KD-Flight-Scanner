name: Validate Flight Scanner

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate-scanner.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile scanner
        run: python -m py_compile scripts/scan_weekends.py
      - name: Run date-window tests
        run: python -m unittest discover -s tests -v
